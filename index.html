<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xena Wild Sessions</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #080808;
  padding: 28px 15px;
  text-align: center;
  border-bottom: 2px solid #b8860b;
}

header h1 {
  margin: 0;
  color: #e6bd55;
}

header p {
  color: #ccc;
}

nav {
  text-align: center;
  padding: 15px;
  background: #202020;
}

nav a {
  color: white;
  margin: 10px;
  text-decoration: none;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

h2 {
  color: #e6bd55;
  border-bottom: 1px solid #444;
  padding-bottom: 10px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
}

.card {
  background: #222;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #444;
}

.card img,
.card video,
.card iframe {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 10;
  object-fit: cover;
  border: 0;
}

.card p {
  padding: 0 12px 12px;
  color: #ddd;
  line-height: 1.5;
}

footer {
  background: #080808;
  text-align: center;
  padding: 25px;
  color: #aaa;
  margin-top: 30px;
}
</style>
</head>

<body>

<header>
  <h1>Xena Wild Sessions</h1>
  <p>Wrestling Photos, Videos & Sessions</p>
</header>

<nav>
  <a href="#about">About</a>
  <a href="#photos">Photos</a>
  <a href="#videos">Videos</a>
</nav>

<main>

<section id="about">
  <h2>Welcome</h2>
  <p>
    Welcome to Xena Wild Sessions.
    Explore the photo gallery, watch videos,
    and discover the latest sessions.
  </p>
</section>

<section id="photos">
    <h2>Photo Gallery</h2>

    <div class="gallery">

        <div class="card">
            <img src="IMG_0856.jpeg" alt="Wrestling Photo 1">
        </div>

        <div class="card">
            <img src="IMG_0865.jpeg" alt="Wrestling Photo 2">
        </div>

        <div class="card">
            <img src="IMG_0878.jpeg" alt="Wrestling Photo 3">
        </div>

        <div class="card">
            <img src="IMG_0879.jpeg" alt="Wrestling Photo 4">
        </div>

        <div class="card">
            <img src="IMG_0880.jpeg" alt="Wrestling Photo 5">
        </div>

    </div>
</section>

<section id="videos">
  <h2>Video Gallery</h2>

  <div class="gallery">

    <div class="card">
      <iframe
        src="https://www.youtube-nocookie.com/embed/VIDEO_ID"
        title="Wrestling video"
        allowfullscreen>
      </iframe>
      <p>Video 1 — Replace this with your video caption.</p>
    </div>

  </div>
</section>

</main>

<footer>
  <p>&copy; 2026 Xena Wild Sessions</p>
</footer>

</body>
</html>
